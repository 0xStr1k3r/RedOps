name: ci
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - run: make sync-web
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...
      - name: build
        run: make build
  trivy:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t redops:ci .
      - name: trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: redops:ci
          severity: HIGH,CRITICAL
