# Reverse proxy for RedOps: TLS termination + hardening headers.
# RedOps itself serves plain HTTP on loopback; expose only via this proxy.
# Requires: certbot certificates for redops.example.com (adjust server_name).

upstream redops {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name redops.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name redops.example.com;

    ssl_certificate     /etc/letsencrypt/live/redops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redops.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # RedOps uses Bearer tokens (no cookies), so no CSRF origin gap to close;
    # still send a restrictive baseline for the served GUI.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;  # API caps JSON bodies at 1MB

    location / {
        proxy_pass http://redops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
